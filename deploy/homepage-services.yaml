# Homepage services.yaml snippet for devdash.
#
# Paste the entry below into the "Activity" group of your Homepage
# `services.yaml` (/volumeUSB1/usbshare/docker/homepage/config on the NAS).
# The indentation is the file's own — group items at four spaces, their keys at
# eight — so this block can be dropped in as-is. Homepage hot-reloads
# services.yaml, so no restart is needed.
#
# Both the iframe src and the href are read by the BROWSER, so both need a
# tailnet route from whatever device is looking at the dashboard: devdash
# binds to the tailnet IP only, so the card opens from tailnet clients and
# fails from LAN-only ones — the same trade netwatch-dash made. siteMonitor
# is the exception, fetched server-side by the NAS, which cannot resolve
# `mac-studio` (its only nameserver is the LAN router) — hence the IP.
#
# The widget is an iframe of `/tile.html`, a route that renders the status
# strip and nothing else. A `customapi` widget was the first attempt and it
# could not show the memory meter, nor what the VM has in total — only
# isolated label/value pairs. Iframing the real component means the card
# cannot disagree with the page.

    - devdash:
        icon: mdi-microsoft-visual-studio-code
        href: http://100.77.144.14:3990/
        description: devcontainers on mac-studio — what is running, and what it costs
        siteMonitor: http://100.77.144.14:3990/healthz
        widget:
          type: iframe
          src: http://100.77.144.14:3990/tile.html
          classes: h-40 md:h-44
          refreshInterval: 15000
